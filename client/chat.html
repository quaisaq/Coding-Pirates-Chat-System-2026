<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 10px;
        }

        input {
            padding: 8px;
            margin: 4px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
        }

        #messages {
            list-style: none;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
        }

        #messages li {
            padding: 4px 0;
        }

        #messages li.mine {
            text-align: right;
            color: #0066cc;
        }

        #messages li.system {
            color: #888;
            font-style: italic;
        }

        #sendForm {
            display: flex;
            gap: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 50%;
            vertical-align: middle;
            margin: 0 8px;
        }

        #roomForm {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #roomForm[hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <div id="connect">
        <h1>Join chat</h1>
        <input id="username" placeholder="Username" maxlength="24" autocomplete="nickname">
        <input id="ip" placeholder="IP address (e.g. localhost)" autocomplete="url" value="10.59.123.15">
        <input id="port" placeholder="Port (e.g. 12345)" inputmode="numeric" value="12345">
        <label for="icon">User icon (optional, image up to 2 MiB)</label>
        <input id="icon" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
        <button id="connectBtn" type="button">Connect</button>
        <p id="status" role="status"></p>
    </div>

    <div id="chat" hidden>
        <p id="currentRoom" role="status"></p>
        <form id="roomForm" hidden>
            <input id="roomName" placeholder="Join or create a room" maxlength="48" list="roomList" autocomplete="off" aria-label="Room name" value="Lobby">
            <datalist id="roomList"></datalist>
            <button type="submit">Join room</button>
        </form>
        <ul id="messages" aria-live="polite"></ul>
        <form id="sendForm">
            <input id="message" placeholder="Type a message..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <p id="clientVersion"></p>
    <p id="serverVersion" hidden></p>

    <script>
        const CLIENT_VERSION = "1.0.0";
        let socket;
        let username;
        let joined = false;
        let room = null;
        let changingRoom = false;

        const connectDiv = document.getElementById("connect");
        const chatDiv = document.getElementById("chat");
        const statusText = document.getElementById("status");
        const messages = document.getElementById("messages");
        const messageInput = document.getElementById("message");
        const connectButton = document.getElementById("connectBtn");
        const roomForm = document.getElementById("roomForm");
        const roomName = document.getElementById("roomName");
        const currentRoom = document.getElementById("currentRoom");
        const roomList = document.getElementById("roomList");
        const serverVersion = document.getElementById("serverVersion");

        document.getElementById("clientVersion").textContent = `Client version: ${CLIENT_VERSION}`;

        function addMessage(text, cssClass, icon) {
            const li = document.createElement("li");
            if (typeof icon === "string" && icon.length <= 87416 &&
                /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/]+=*$/.test(icon)) {
                const image = document.createElement("img");
                image.src = icon;
                image.className = "avatar";
                image.alt = "";
                li.appendChild(image);
            }
            li.appendChild(document.createTextNode(text));
            if (cssClass) li.className = cssClass;
            messages.appendChild(li);
            messages.scrollTop = messages.scrollHeight;
        }

        async function loadIcon(file) {
            if (!file) return null;
            if (!["image/png", "image/jpeg", "image/gif", "image/webp"].includes(file.type) ||
                file.size > 2 * 1024 * 1024) {
                throw new Error("Choose a PNG, JPEG, GIF or WebP image up to 2 MiB.");
            }
            const url = URL.createObjectURL(file);
            try {
                const image = new Image();
                image.src = url;
                await image.decode();
                const canvas = document.createElement("canvas");
                const scale = Math.min(1, 64 / image.width, 64 / image.height);
                canvas.width = Math.max(1, Math.round(image.width * scale));
                canvas.height = Math.max(1, Math.round(image.height * scale));
                const context = canvas.getContext("2d");
                if (!context) throw new Error("Could not prepare your icon.");
                context.drawImage(image, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL("image/png");
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        connectButton.addEventListener("click", async () => {
            username = document.getElementById("username").value.trim();
            const ip = document.getElementById("ip").value.trim();
            const port = document.getElementById("port").value.trim();

            if (!username || username.length > 24) {
                statusText.textContent = "Choose a username with 1 to 24 characters.";
                return;
            }
            if (!ip || !/^\d+$/.test(port) || Number(port) < 1 || Number(port) > 65535) {
                statusText.textContent = "Enter a valid IP address and port.";
                return;
            }

            statusText.textContent = "Connecting...";
            connectButton.disabled = true;
            joined = false;
            serverVersion.hidden = true;
            serverVersion.textContent = "";
            room = null;
            changingRoom = false;

            let icon;
            try {
                icon = await loadIcon(document.getElementById("icon").files[0]);
            } catch (error) {
                statusText.textContent = `Could not load icon: ${error.message}`;
                connectButton.disabled = false;
                return;
            }

            try {
                socket = new WebSocket(`ws://${ip}:${port}`);
            } catch {
                statusText.textContent = "Could not connect. Check the address and port.";
                connectButton.disabled = false;
                return;
            }

            socket.onopen = () => {
                socket.send(JSON.stringify({
                    type: "join", username, icon,
                    features: ["rooms", "icons", "versions"],
                    client_version: CLIENT_VERSION,
                }));
            };

            socket.onmessage = (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch {
                    addMessage("Received an invalid message from the server.", "system");
                    return;
                }

                switch (data.type) {
                    case "joined":
                        joined = true;
                        serverVersion.textContent = typeof data.server_version === "string"
                            ? `Server version: ${data.server_version}`
                            : "Server version: unknown (not provided by this server)";
                        serverVersion.hidden = false;
                        messages.replaceChildren();
                        connectDiv.hidden = true;
                        chatDiv.hidden = false;
                        room = data.room || null;
                        roomForm.hidden = !Array.isArray(data.features) || !data.features.includes("rooms");
                        currentRoom.textContent = room ? `Room: ${room}` : "This server does not support rooms.";
                        addMessage(`Connected as ${data.username}.`, "system");
                        if (icon && (!Array.isArray(data.features) || !data.features.includes("icons"))) {
                            addMessage("This server does not support user icons.", "system");
                        }
                        messageInput.focus();
                        break;
                    case "rooms":
                        roomList.replaceChildren();
                        for (const entry of data.rooms) {
                            const option = document.createElement("option");
                            option.value = entry.name;
                            option.label = `${entry.users} users`;
                            roomList.appendChild(option);
                        }
                        break;
                    case "room_joined":
                        if (room !== data.room) messages.replaceChildren();
                        room = data.room;
                        roomName.value = room;
                        changingRoom = false;
                        currentRoom.textContent = `Room: ${room}`;
                        addMessage(`Joined room ${room}.`, "system");
                        messageInput.focus();
                        break;
                    case "user_joined":
                        addMessage(`${data.username} joined the chat.`, "system");
                        break;
                    case "user_left":
                        addMessage(`${data.username} left the chat.`, "system");
                        break;
                    case "message":
                        addMessage(`${data.username}: ${data.text}`, data.username === username ? "mine" : "", data.icon);
                        break;
                    case "error":
                        changingRoom = false;
                        statusText.textContent = data.message;
                        addMessage(data.message, "system");
                        break;
                    default:
                        addMessage("Received an unknown event from the server.", "system");
                }
            };

            socket.onerror = () => {
                statusText.textContent = "Could not connect.";
            };

            socket.onclose = () => {
                if (joined) addMessage("Disconnected", "system");
                joined = false;
                serverVersion.hidden = true;
                serverVersion.textContent = "";
                changingRoom = false;
                roomForm.hidden = true;
                connectDiv.hidden = false;
                chatDiv.hidden = true;
                connectButton.disabled = false;
            };
        });

        roomForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const requestedRoom = roomName.value.trim();
            if (!joined || changingRoom || socket.readyState !== WebSocket.OPEN) return;
            if (!requestedRoom || requestedRoom.length > 48) {
                addMessage("Choose a room name with 1 to 48 characters.", "system");
                return;
            }
            changingRoom = true;
            socket.send(JSON.stringify({ type: "join_room", room: requestedRoom }));
        });

        document.getElementById("sendForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const text = messageInput.value;
            if (!joined || socket.readyState !== WebSocket.OPEN) return;
            if (changingRoom) {
                addMessage("Wait until the room change is confirmed before sending.", "system");
                return;
            }

            socket.send(JSON.stringify({ type: "message", text }));
            messageInput.value = "";
        });
    </script>
</body>
</html>
