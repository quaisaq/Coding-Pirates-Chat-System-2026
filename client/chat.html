<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div id="connect">
        <h1>Join chat</h1>
        <input id="ip" placeholder="IP address (e.g. localhost)">
        <input id="port" placeholder="Port (e.g. 5000)">
        <button id="connectBtn">Connect</button>
        <p id="status"></p>
    </div>

    <div id="chat" hidden>
        <ul id="messages"></ul>
        <form id="sendForm">
            <input id="message" placeholder="Type a message..." autocomplete="off">
            <button>Send</button>
        </form>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
