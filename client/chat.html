<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 10px;
        }

        input {
            padding: 8px;
            margin: 4px 0;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
        }

        #messages {
            list-style: none;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
        }

        #messages li {
            padding: 4px 0;
        }

        #messages li.mine {
            text-align: right;
            color: var(--mine-color, #0066cc);
        }

        #messages li.system {
            color: var(--system-color, #888);
            font-style: italic;
        }

        #sendForm {
            display: flex;
            gap: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 50%;
            vertical-align: middle;
            margin: 0 8px;
        }

        #roomForm {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #roomForm[hidden] {
            display: none;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
        }

        input[type="checkbox"] {
            width: auto;
        }

        .message-image {
            display: block;
            max-width: 100%;
            max-height: 240px;
            width: auto;
            height: auto;
            margin-top: 8px;
        }

        .mine .message-image {
            margin-left: auto;
        }

        .image-error {
            display: block;
            margin-top: 8px;
            font-size: 0.9em;
        }

        #adminSettings summary {
            cursor: pointer;
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <div id="connect">
        <h1>Join chat</h1>
        <input id="username" placeholder="Username" maxlength="24" autocomplete="nickname">
        <input id="ip" placeholder="IP address (e.g. localhost)" autocomplete="url" value="10.59.123.15">
        <input id="port" placeholder="Port (e.g. 12345)" inputmode="numeric" value="12345">
        <label for="icon">User icon (optional, image up to 2 MiB)</label>
        <input id="icon" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
        <button id="connectBtn" type="button">Connect</button>
        <p id="status" role="status"></p>
    </div>

    <div id="chat" hidden>
        <p id="currentRoom" role="status"></p>
        <form id="roomForm" hidden>
            <input id="roomName" placeholder="Join or create a room" maxlength="48" list="roomList" autocomplete="off" aria-label="Room name" value="Lobby">
            <datalist id="roomList"></datalist>
            <button type="submit">Join room</button>
        </form>
        <p id="roomInfo"></p>
        <form id="adminForm" hidden>
            <details id="adminSettings">
                <summary>Room administration</summary>
                <fieldset>
                    <legend>Room administration</legend>
                    <label><input id="privateRoom" type="checkbox"> Private room (only allowed usernames)</label>
                    <p><label for="allowedUsernames">Allowed usernames (one per line, up to 100)</label></p>
                    <textarea id="allowedUsernames" rows="4"></textarea>
                    <p>The admin always has access. Removed users are moved to Lobby.
                        The room and its settings remain saved when the admin is offline.</p>
                    <label for="backgroundColor">Room background color</label>
                    <input id="backgroundColor" type="color" value="#ffffff">
                    <button type="submit">Save room settings</button>
                    <p id="adminStatus" role="status"></p>
                </fieldset>
            </details>
        </form>
        <ul id="messages" aria-live="polite"></ul>
        <form id="sendForm">
            <input id="message" placeholder="Type a message..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <p id="clientVersion"></p>
    <p id="serverVersion" hidden></p>

    <script>
        const CLIENT_VERSION = "1.3.1";
        let socket;
        let username;
        let joined = false;
        let room = null;
        let changingRoom = false;
        let supportsRoomAdmin = false;
        let isRoomAdmin = false;
        let savingSettings = false;
        let supportsHistory = false;
        let resumeRoom = null;
        let connectionSettings = null;

        const connectDiv = document.getElementById("connect");
        const chatDiv = document.getElementById("chat");
        const statusText = document.getElementById("status");
        const messages = document.getElementById("messages");
        const messageInput = document.getElementById("message");
        const connectButton = document.getElementById("connectBtn");
        const roomForm = document.getElementById("roomForm");
        const roomName = document.getElementById("roomName");
        const currentRoom = document.getElementById("currentRoom");
        const roomList = document.getElementById("roomList");
        const serverVersion = document.getElementById("serverVersion");
        const adminForm = document.getElementById("adminForm");
        const adminSettings = document.getElementById("adminSettings");
        const roomInfo = document.getElementById("roomInfo");
        const adminStatus = document.getElementById("adminStatus");
        const privateRoom = document.getElementById("privateRoom");
        const allowedUsernames = document.getElementById("allowedUsernames");
        const backgroundColor = document.getElementById("backgroundColor");

        document.getElementById("clientVersion").textContent = `Client version: ${CLIENT_VERSION}`;

        function rememberConnection() {
            if (!connectionSettings) return;
            try {
                sessionStorage.setItem("chatConnection", JSON.stringify({...connectionSettings, room}));
            } catch (error) {
                if (!(error instanceof DOMException)) throw error;
                addMessage("Could not remember this connection for refresh.", "system");
            }
        }

        function resetRoomSettings() {
            adminForm.hidden = true;
            adminSettings.open = false;
            isRoomAdmin = false;
            savingSettings = false;
            roomInfo.textContent = "";
            adminStatus.textContent = "";
            document.body.style.backgroundColor = "";
            document.body.style.color = "";
            document.body.style.removeProperty("--mine-color");
            document.body.style.removeProperty("--system-color");
        }

        function applyRoomState(data) {
            if (data.room !== room || !supportsRoomAdmin) return;
            if (typeof data.background !== "string" || !/^#[0-9a-fA-F]{6}$/.test(data.background)) {
                addMessage("Received an invalid room background from the server.", "system");
                return;
            }
            const rgb = data.background.slice(1).match(/../g).map(value => parseInt(value, 16) / 255);
            const linear = rgb.map(value => value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4);
            const luminance = 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
            const foreground = luminance > 0.179 ? "#000000" : "#ffffff";
            document.body.style.backgroundColor = data.background;
            document.body.style.color = foreground;
            document.body.style.setProperty("--mine-color", foreground);
            document.body.style.setProperty("--system-color", foreground);
            isRoomAdmin = typeof data.is_admin === "boolean" ? data.is_admin : data.admin === username;
            adminForm.hidden = !isRoomAdmin;
            roomInfo.textContent = data.admin
                ? `Admin: ${data.admin}${isRoomAdmin ? " (you)" : ""} | ${data.private ? "Private" : "Open"} room`
                : "Lobby is open to everyone and has no admin.";
            if (isRoomAdmin) {
                privateRoom.checked = data.private;
                allowedUsernames.value = data.allowed_usernames.join("\n");
                backgroundColor.value = data.background;
                adminStatus.textContent = savingSettings ? "Room settings saved." : "";
            }
            savingSettings = false;
        }

        function imageUrls(text) {
            const urls = new Set();
            for (const match of text.matchAll(/https?:\/\/[^\s<>"']+/gi)) {
                let candidate = match[0].replace(/[.,!?;:]+$/, "");
                for (const [open, close] of [["(", ")"], ["[", "]"], ["{", "}"]]) {
                    while (candidate.endsWith(close) &&
                        candidate.split(close).length > candidate.split(open).length) {
                        candidate = candidate.slice(0, -1);
                    }
                }
                let url;
                try {
                    url = new URL(candidate);
                } catch (error) {
                    if (!(error instanceof TypeError)) throw error;
                    continue;
                }
                if (url.username || url.password) continue;
                if (/\.(png|jpe?g|gif|webp|avif|bmp|svg|ico)$/i.test(url.pathname) ||
                    /^(png|jpe?g|gif|webp|avif|bmp|svg|ico)$/i.test(url.searchParams.get("format") || "")) {
                    urls.add(url.href);
                }
            }
            return urls;
        }

        function addMessage(text, cssClass, icon) {
            const li = document.createElement("li");
            if (typeof icon === "string" && icon.length <= 87416 &&
                /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/]+=*$/.test(icon)) {
                const image = document.createElement("img");
                image.src = icon;
                image.className = "avatar";
                image.alt = "";
                li.appendChild(image);
            }
            li.appendChild(document.createTextNode(text));
            if (cssClass) li.className = cssClass;
            if (cssClass !== "system") {
                for (const url of imageUrls(text)) {
                    const image = document.createElement("img");
                    image.className = "message-image";
                    image.alt = `Image from ${url}`;
                    image.loading = "lazy";
                    image.referrerPolicy = "no-referrer";
                    image.addEventListener("load", () => {
                        if (li === messages.lastElementChild) messages.scrollTop = messages.scrollHeight;
                    });
                    image.addEventListener("error", () => {
                        const error = document.createElement("span");
                        error.className = "image-error";
                        error.textContent = `Could not load image: ${url}`;
                        image.replaceWith(error);
                    }, {once: true});
                    image.src = url;
                    li.appendChild(image);
                }
            }
            messages.appendChild(li);
            messages.scrollTop = messages.scrollHeight;
        }

        async function loadIcon(file) {
            if (!file) return null;
            if (!["image/png", "image/jpeg", "image/gif", "image/webp"].includes(file.type) ||
                file.size > 2 * 1024 * 1024) {
                throw new Error("Choose a PNG, JPEG, GIF or WebP image up to 2 MiB.");
            }
            const url = URL.createObjectURL(file);
            try {
                const image = new Image();
                image.src = url;
                await image.decode();
                const canvas = document.createElement("canvas");
                const scale = Math.min(1, 64 / image.width, 64 / image.height);
                canvas.width = Math.max(1, Math.round(image.width * scale));
                canvas.height = Math.max(1, Math.round(image.height * scale));
                const context = canvas.getContext("2d");
                if (!context) throw new Error("Could not prepare your icon.");
                context.drawImage(image, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL("image/png");
            } finally {
                URL.revokeObjectURL(url);
            }
        }

        connectButton.addEventListener("click", async () => {
            username = document.getElementById("username").value.trim();
            const ip = document.getElementById("ip").value.trim();
            const port = document.getElementById("port").value.trim();

            if (!username || username.length > 24) {
                statusText.textContent = "Choose a username with 1 to 24 characters.";
                return;
            }
            if (!ip || !/^\d+$/.test(port) || Number(port) < 1 || Number(port) > 65535) {
                statusText.textContent = "Enter a valid IP address and port.";
                return;
            }

            statusText.textContent = "Connecting...";
            connectButton.disabled = true;
            joined = false;
            supportsHistory = false;
            connectionSettings = {username, ip, port};
            resetRoomSettings();
            supportsRoomAdmin = false;
            serverVersion.hidden = true;
            serverVersion.textContent = "";
            room = null;
            changingRoom = false;

            let icon;
            try {
                icon = await loadIcon(document.getElementById("icon").files[0]);
            } catch (error) {
                statusText.textContent = `Could not load icon: ${error.message}`;
                connectButton.disabled = false;
                return;
            }

            try {
                socket = new WebSocket(`ws://${ip}:${port}`);
            } catch {
                statusText.textContent = "Could not connect. Check the address and port.";
                connectButton.disabled = false;
                return;
            }

            socket.onopen = () => {
                socket.send(JSON.stringify({
                    type: "join", username, icon,
                    features: ["rooms", "icons", "versions", "room_admin", "history"],
                    client_version: CLIENT_VERSION,
                }));
            };

            socket.onmessage = (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch {
                    addMessage("Received an invalid message from the server.", "system");
                    return;
                }

                switch (data.type) {
                    case "joined":
                        joined = true;
                        serverVersion.textContent = typeof data.server_version === "string"
                            ? `Server version: ${data.server_version}`
                            : "Server version: unknown (not provided by this server)";
                        serverVersion.hidden = false;
                        messages.replaceChildren();
                        connectDiv.hidden = true;
                        chatDiv.hidden = false;
                        room = data.room || null;
                        supportsHistory = Array.isArray(data.features) && data.features.includes("history");
                        resetRoomSettings();
                        supportsRoomAdmin = Array.isArray(data.features) && data.features.includes("room_admin");
                        if (room && !supportsRoomAdmin) {
                            roomInfo.textContent = "This server does not support room administration.";
                        }
                        roomForm.hidden = !Array.isArray(data.features) || !data.features.includes("rooms");
                        currentRoom.textContent = room ? `Room: ${room}` : "This server does not support rooms.";
                        addMessage(`Connected as ${data.username}.`, "system");
                        if (!supportsHistory) {
                            addMessage("This server does not support saved message history.", "system");
                        }
                        if (icon && (!Array.isArray(data.features) || !data.features.includes("icons"))) {
                            addMessage("This server does not support user icons.", "system");
                        }
                        messageInput.focus();
                        if (resumeRoom && resumeRoom !== room && !roomForm.hidden) {
                            changingRoom = true;
                            socket.send(JSON.stringify({type: "join_room", room: resumeRoom}));
                        } else {
                            rememberConnection();
                        }
                        resumeRoom = null;
                        break;
                    case "rooms":
                        roomList.replaceChildren();
                        for (const entry of data.rooms) {
                            const option = document.createElement("option");
                            option.value = entry.name;
                            option.label = `${entry.users} users`;
                            roomList.appendChild(option);
                        }
                        break;
                    case "room_joined":
                        if (room !== data.room) messages.replaceChildren();
                        resetRoomSettings();
                        room = data.room;
                        roomName.value = room;
                        rememberConnection();
                        changingRoom = false;
                        currentRoom.textContent = `Room: ${room}`;
                        if (!supportsRoomAdmin) {
                            roomInfo.textContent = "This server does not support room administration.";
                        }
                        addMessage(`Joined room ${room}.`, "system");
                        if (data.reason) addMessage(data.reason, "system");
                        messageInput.focus();
                        break;
                    case "room_state":
                        applyRoomState(data);
                        break;
                    case "history":
                        if (!supportsHistory || data.room !== room) break;
                        if (!Array.isArray(data.messages)) {
                            addMessage("Received invalid message history from the server.", "system");
                            break;
                        }
                        for (const item of messages.querySelectorAll("li:not(.system), li[data-history-status]")) {
                            item.remove();
                        }
                        addMessage(`Loaded ${data.messages.length} saved messages from ${room}.`, "system");
                        messages.lastElementChild.dataset.historyStatus = "";
                        for (const entry of data.messages) {
                            addMessage(`${entry.username}: ${entry.text}`, entry.username === username ? "mine" : "", entry.icon);
                        }
                        break;
                    case "user_joined":
                        addMessage(`${data.username} joined the chat.`, "system");
                        break;
                    case "user_left":
                        addMessage(`${data.username} left the chat.`, "system");
                        break;
                    case "message":
                        addMessage(`${data.username}: ${data.text}`, data.username === username ? "mine" : "", data.icon);
                        break;
                    case "error":
                        changingRoom = false;
                        rememberConnection();
                        if (savingSettings) adminStatus.textContent = data.message;
                        savingSettings = false;
                        statusText.textContent = data.message;
                        addMessage(data.message, "system");
                        break;
                    default:
                        addMessage("Received an unknown event from the server.", "system");
                }
            };

            socket.onerror = () => {
                statusText.textContent = "Could not connect.";
            };

            socket.onclose = () => {
                if (joined) addMessage("Disconnected", "system");
                joined = false;
                resetRoomSettings();
                supportsRoomAdmin = false;
                serverVersion.hidden = true;
                serverVersion.textContent = "";
                changingRoom = false;
                roomForm.hidden = true;
                connectDiv.hidden = false;
                chatDiv.hidden = true;
                connectButton.disabled = false;
            };
        });

        roomForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const requestedRoom = roomName.value.trim();
            if (!joined || changingRoom || socket.readyState !== WebSocket.OPEN) return;
            if (!requestedRoom || requestedRoom.length > 48) {
                addMessage("Choose a room name with 1 to 48 characters.", "system");
                return;
            }
            changingRoom = true;
            socket.send(JSON.stringify({ type: "join_room", room: requestedRoom }));
        });

        adminForm.addEventListener("submit", (event) => {
            event.preventDefault();
            if (!joined || !isRoomAdmin || socket.readyState !== WebSocket.OPEN) return;
            if (changingRoom || savingSettings) {
                adminStatus.textContent = "Wait for the pending change to be confirmed.";
                return;
            }
            const allowed = allowedUsernames.value.split(/\r?\n/).map(name => name.trim()).filter(Boolean);
            if (allowed.length > 100 || allowed.some(name => name.length > 24)) {
                adminStatus.textContent = "Provide up to 100 usernames with 1 to 24 characters each.";
                return;
            }
            savingSettings = true;
            adminStatus.textContent = "Saving...";
            socket.send(JSON.stringify({
                type: "update_room", room, private: privateRoom.checked,
                allowed_usernames: allowed, background: backgroundColor.value,
            }));
        });

        document.getElementById("sendForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const text = messageInput.value;
            if (!joined || socket.readyState !== WebSocket.OPEN) return;
            if (changingRoom) {
                addMessage("Wait until the room change is confirmed before sending.", "system");
                return;
            }

            socket.send(JSON.stringify({ type: "message", text }));
            messageInput.value = "";
        });

        try {
            const saved = sessionStorage.getItem("chatConnection");
            if (saved) {
                const settings = JSON.parse(saved);
                if (settings && typeof settings.username === "string" &&
                    typeof settings.ip === "string" && typeof settings.port === "string") {
                    document.getElementById("username").value = settings.username;
                    document.getElementById("ip").value = settings.ip;
                    document.getElementById("port").value = settings.port;
                    resumeRoom = typeof settings.room === "string" ? settings.room : null;
                    connectButton.click();
                } else {
                    statusText.textContent = "Saved connection is invalid. Enter your connection details again.";
                }
            }
        } catch (error) {
            if (!(error instanceof DOMException) && !(error instanceof SyntaxError)) throw error;
            statusText.textContent = "Could not restore the saved connection. Enter your connection details again.";
        }
    </script>
</body>
</html>
